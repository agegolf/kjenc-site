<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영수증 업로드 | 케이제이ENC</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/staff.css">
<meta name="robots" content="noindex, nofollow">
</head>
<body class="bg-white text-[color:var(--kjenc-navy-900)]">
<header class="staff-header">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-semibold hover:underline">&larr; 케이제이ENC 직원 페이지</a>
    <div class="text-sm flex items-center gap-3">
      <span><span id="session-name"></span>님</span>
      <button onclick="staffLogout()" class="text-gray-300 underline">로그아웃</button>
    </div>
  </div>
</header>

<div class="staff-shell">
  <h1 class="text-xl font-bold mb-1">영수증 업로드</h1>
  <p class="text-sm text-gray-500 mb-6">본인 영수증을 직접 등록해주세요. (식비·유류비·정비·통행료·기타 — 세무 제출용으로 활용됩니다)</p>

  <form id="receipt-form" class="staff-card space-y-5">
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="staff-label">날짜</label>
        <input type="date" id="f-date" class="staff-input">
      </div>
      <div>
        <label class="staff-label">현장명</label>
        <select id="f-site-select" class="staff-select"></select>
        <input type="text" id="f-site" class="staff-input hidden mt-2" placeholder="새 현장명 직접입력">
      </div>
    </div>

    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="staff-label">항목분류</label>
        <select id="f-category" class="staff-select">
          <option value="식비">식비</option>
          <option value="숙박">숙박</option>
          <option value="유류비">유류비</option>
          <option value="정비">정비</option>
          <option value="통행료">통행료</option>
          <option value="기타">기타</option>
        </select>
      </div>
      <div>
        <label class="staff-label">결제수단</label>
        <select id="f-payment" class="staff-select" required>
          <option value="">선택해주세요</option>
          <option value="회사카드">회사카드</option>
          <option value="개인카드">개인카드</option>
        </select>
      </div>
    </div>

    <div>
      <label class="staff-label">금액 (원, 합계)</label>
      <input type="number" id="f-amount" class="staff-input" placeholder="예: 13000">
    </div>

    <div id="vehicle-field" class="hidden">
      <label class="staff-label">차량번호 (선택)</label>
      <select id="f-vehicle" class="staff-select"></select>
      <p class="text-xs text-gray-400 mt-1">유류비·정비·통행료 지출인 경우에만 선택해주세요.</p>
    </div>

    <div id="maintenance-field" class="hidden">
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="staff-label">주행거리 (km)</label>
          <input type="number" id="f-mileage" class="staff-input" min="0" placeholder="예: 85000">
        </div>
        <div>
          <label class="staff-label">정비유형</label>
          <select id="f-maintenance-type" class="staff-select">
            <option value="">선택해주세요</option>
            <option value="엔진오일">엔진오일</option>
            <option value="타이어">타이어</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>
    </div>

    <div id="room-type-field" class="hidden">
      <label class="staff-label">방타입 (인실 유형별 개수)</label>
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-xs text-gray-500">1인실</label>
          <input type="number" id="f-room-1" class="staff-input" min="0" value="0">
        </div>
        <div>
          <label class="text-xs text-gray-500">2인실</label>
          <input type="number" id="f-room-2" class="staff-input" min="0" value="0">
        </div>
        <div>
          <label class="text-xs text-gray-500">3인실</label>
          <input type="number" id="f-room-3" class="staff-input" min="0" value="0">
        </div>
      </div>
    </div>

    <div id="participants-field" class="hidden">
      <label class="staff-label">함께한 인원 (본인 포함)</label>
      <div id="f-participants" class="grid grid-cols-3 gap-2 text-sm"></div>
      <p class="text-xs text-gray-400 mt-1">금액은 선택한 인원 수로 균등분배되어 식대지출/숙박예약에 기록됩니다.</p>
    </div>

    <div>
      <label class="staff-label">영수증 사진</label>
      <input type="file" id="f-photo" accept="image/*" capture="environment" class="staff-input">
      <p class="text-xs text-gray-400 mt-1">세무 처리는 이 사진을 기준으로 세무사가 별도로 진행합니다 — 원본이 잘 보이게 찍어주세요.</p>
    </div>

    <div>
      <label class="staff-label">메모 (선택)</label>
      <input type="text" id="f-memo" class="staff-input" placeholder="예: 안산현장 중식">
    </div>

    <p id="receipt-msg" class="staff-msg hidden"></p>
    <button type="submit" class="btn-cta w-full py-3 rounded font-semibold" id="receipt-submit-btn">영수증 등록</button>
    <button type="button" id="receipt-cancel-edit-btn" class="hidden w-full py-2 rounded border border-gray-300 text-sm text-gray-500">수정 취소</button>
  </form>

  <div class="mt-10">
    <h2 class="text-lg font-bold mb-1">내 제출 내역</h2>
    <p class="text-sm text-gray-500 mb-4">본인이 등록한 영수증만 보이며, 승인 여부와 무관하게 직접 수정·삭제할 수 있습니다.</p>
    <div id="my-receipts-list" class="space-y-3"></div>
    <p id="my-receipts-empty" class="text-sm text-gray-400 hidden">등록한 영수증이 없습니다.</p>
  </div>
</div>

<template id="my-receipt-item-template">
  <div class="staff-card space-y-1 text-sm">
    <div class="flex justify-between items-start">
      <div>
        <span class="font-semibold r-category"></span>
        <span class="text-gray-400 r-date ml-2"></span>
        <span class="r-site text-gray-500 ml-2"></span>
      </div>
      <span class="r-status text-xs px-2 py-0.5 rounded bg-gray-100"></span>
    </div>
    <div class="r-amount font-semibold"></div>
    <div class="r-payment text-gray-500 text-xs"></div>
    <div class="r-history text-xs text-gray-400 hidden"></div>
    <div class="flex gap-2 pt-1">
      <button class="r-edit-btn text-xs px-3 py-1 rounded border border-gray-300">수정</button>
      <button class="r-delete-btn text-xs px-3 py-1 rounded border border-red-300 text-red-500">삭제</button>
    </div>
  </div>
</template>

<script src="../assets/js/staff-config.js"></script>
<script src="../assets/js/staff-receipts.js"></script>
</body>
</html>
